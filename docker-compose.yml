services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: laruche
      DB_PASS: laruche
      DB_NAME: laruchxsabine
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: laruchxsabine
      MYSQL_USER: laruche
      MYSQL_PASSWORD: laruche
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./scriptSQL/LaRuche_creationPROD.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "laruche", "-plaruche"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
